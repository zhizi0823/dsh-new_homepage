name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Static audit (locale keys, icons, CSS)
        run: node test/audit.mjs

      - name: Smoke render (registration, session list, palette, picker)
        run: node test/smoke.cjs
